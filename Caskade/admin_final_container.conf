log_format admin_fmt escape=none
    '$time_iso8601 | INFO    | nginx      | $status $request_method $uri ($remote_addr, ${request_time}s)';

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    sendfile off;
    tcp_nopush on;
    tcp_nodelay on;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fd00::/8;
    real_ip_header X-Real-IP;
    real_ip_recursive on;

    resolver 127.0.0.11 valid=30s ipv6=off;

    access_log /app/logs/nginx_access.log admin_fmt;
    error_log  /app/logs/nginx_error.log warn;

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =204; }
    
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # WebSocket proxy
    location ~ ^/api/v2/(ws|agent/ws) {
        set $backend http://web-backend:8081;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # API proxy
    location /api/ {
        set $backend http://web-backend:8081;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
