version: '3.8'

services:
  db-admin:
    image: postgres:15-alpine
    container_name: remna-admin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: remna_admin
      POSTGRES_PASSWORD: secure_pass_admin_123
      POSTGRES_DB: remna_admin_db
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - remnawave_default

  remna-admin-bot:
    image: ghcr.io/case211/remnawave-admin:latest
    container_name: remna-admin-bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db-admin
    networks:
      - remnawave_default

  remna-admin-backend:
    image: ghcr.io/case211/remnawave-admin-web-backend:latest
    container_name: remna-admin-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3011:8081"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db-admin
    networks:
      - remnawave_default

  remna-admin-frontend:
    image: nginx:alpine
    container_name: remna-admin-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./frontend_nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - remnawave_default
    depends_on:
      - remna-admin-backend

networks:
  remnawave_default:
    external: true
