version: '3.8'

services:
  admin-db:
    image: postgres:16-alpine
    container_name: remnawave-admin-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - admin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - remnawave-admin-network

  admin-bot:
    image: ghcr.io/case211/remnawave-admin:latest
    container_name: admin-bot-1
    restart: always
    env_file:
      - admin_final.env
    depends_on:
      admin-db:
        condition: service_healthy
    networks:
      - remnawave-admin-network

  web-backend:
    image: ghcr.io/case211/remnawave-admin-web-backend:latest
    container_name: remnawave-web-backend
    restart: always
    env_file:
      - admin_final.env
    environment:
      WEB_HOST: '0.0.0.0'
      WEB_PORT: '8081'
    ports:
      - "8081:8081"
      - "2525:2525"
      - "587:587"
    depends_on:
      admin-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/api/v2/health')"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - remnawave-admin-network

  web-frontend:
    image: ghcr.io/case211/remnawave-admin-web-frontend:latest
    container_name: remnawave-web-frontend
    restart: always
    env_file:
      - admin_final.env
    volumes:
      - ./logs:/app/logs
      - ./nginx_frontend.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_FRONTEND_PORT:-3010}:80"
    depends_on:
      web-backend:
        condition: service_started
    networks:
      - remnawave-admin-network

volumes:
  admin_postgres_data:
  geoip_data:

networks:
  remnawave-admin-network:
    driver: bridge
