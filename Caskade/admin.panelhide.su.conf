server {
    listen 80;
    server_name admin.panelhide.su;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.panelhide.su;

    ssl_certificate /etc/letsencrypt/live/panelhide.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panelhide.su/privkey.pem;

    # API напрямую на бэкенд (БЕЗ слэша в конце)
    location /api/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Всё остальное на фронтенд
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
