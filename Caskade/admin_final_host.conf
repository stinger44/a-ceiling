server {
    listen 80;
    listen 443 ssl;
    server_name admin.panelhide.su;

    ssl_certificate /etc/letsencrypt/live/admin.panelhide.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.panelhide.su/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Standard headers from your screenshot
        proxy_set_header User-Agent $http_user_agent;

        # Buffering settings from your screenshot for stability
        proxy_buffers 8 16k;
        proxy_buffer_size 32k;
        
        # Timeout for long polling
        proxy_read_timeout 3600s;
    }
}
